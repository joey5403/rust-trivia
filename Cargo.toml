[package]
name = "rust-trivia"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_trivia"
path = "src/lib.rs"

[[bin]]
name = "rust-trivia"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
tokio = { version = "1.45", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[[bench]]
name = "translation_bench"
harness = false
